[package]
name = "pristimer-store"
version = "0.1.0"
edition = "2024"

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
serde_json = "1"
# 只为了在测试里开一条「对照连接」：默认 busy_timeout = 0 的裸连接，
# 用来证明锁争用下它确实会当场失败 —— 也就是修复前的行为。
rusqlite = { version = "0.37", features = ["bundled"] }

[features]
serde = ["dep:serde"]
