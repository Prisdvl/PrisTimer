name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust-test:
    name: Rust tests (core + store)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-test-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      # 顶层 Cargo workspace：单条命令跑全部成员
      - name: Test pristimer-core + pristimer-store
        run: cargo test -p pristimer-core -p pristimer-store --all-features

  rust-clippy:
    name: Clippy (core + store)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: clippy-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      # -D warnings 门禁暂只覆盖纯逻辑 crate：src-tauri 依赖 Tauri/Linux
      # 系统库（webkit2gtk 等），等 CI 加装系统依赖后再纳入
      - name: Clippy core + store
        run: cargo clippy -p pristimer-core -p pristimer-store --all-targets --all-features -- -D warnings

  # src-tauri 是 Windows 专属应用壳（windows-sys / Win32 API），ubuntu 编译不了，
  # 必须在 windows runner 上做门禁。runner 自带 MSVC，链接环境与 release.yml 相同。
  tauri-check:
    name: Clippy + Tests (src-tauri, windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # ★ 必须先造一个 frontendDist 目录（2026-09-17 补）：
      #   `tauri::generate_context!()` 在**编译期**校验 tauri.conf.json 里的
      #   `frontendDist`（"../dist"）存在，而干净的 checkout 里它是空的 ——
      #   proc macro 直接 panic：The `frontendDist` configuration is set to
      #   "../dist" but this path doesn't exist。于是这个 job 自加入起就没绿过，
      #   而本地跑 clippy 时 dist 一直在（刚跑过 tauri build），"本地预演全绿"
      #   把这层掩盖了 —— 门禁形同虚设了两轮。
      #   本 job 只做 lint 与单测，不需要真实前端产物（真正的打包在 Release
      #   workflow 里，那边完整跑 npm ci + vite build），建占位目录即可。
      - name: Stub frontend dist (generate_context! requires the path to exist)
        shell: bash
        run: |
          mkdir -p dist
          printf '<!doctype html><title>ci stub</title>\n' > dist/index.html

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: tauri-check-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Clippy src-tauri
        run: cargo clippy -p pristimer --all-targets --all-features -- -D warnings

      - name: Tests src-tauri
        run: cargo test -p pristimer

  frontend:
    name: Frontend type-check + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: vue-tsc --noEmit
        run: npx vue-tsc --noEmit

      - name: vitest
        run: npm test
