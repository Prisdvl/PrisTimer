name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust-test:
    name: Rust tests (core + store)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-test-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      # 顶层 Cargo workspace：单条命令跑全部成员
      - name: Test pristimer-core + pristimer-store
        run: cargo test -p pristimer-core -p pristimer-store --all-features

  rust-clippy:
    name: Clippy (core + store)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: clippy-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      # -D warnings 门禁暂只覆盖纯逻辑 crate：src-tauri 依赖 Tauri/Linux
      # 系统库（webkit2gtk 等），等 CI 加装系统依赖后再纳入
      - name: Clippy core + store
        run: cargo clippy -p pristimer-core -p pristimer-store --all-targets --all-features -- -D warnings

  frontend:
    name: Frontend type-check + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: vue-tsc --noEmit
        run: npx vue-tsc --noEmit

      - name: vitest
        run: npm test
