[package]
name = "pristimer"
version = "0.4.0"
description = "PrisTimer — a glass-morphism focus timer for Windows with six themes, pomodoro mode and statistics"
authors = ["Prisdvl"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pristimer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "custom-protocol"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pristimer-core = { path = "../pristimer-core", features = ["serde"] }
pristimer-store = { path = "../pristimer-store", features = ["serde"] }

# 开机自启是桌面专属概念（移动端没有）。Cargo.toml 的 target 谓词不认
# tauri-build 注入的 cfg(desktop)，必须写全三个桌面平台；代码侧的
# #[cfg(desktop)] 走 build.rs 注入的 cfg，两处语义对齐。
[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2"

# 无边框窗口的圆角只能走 DWM：`decorations: false` 的窗口没有 WS_CAPTION，
# Windows 不会给它自动圆角，四个直角在深色桌面上像是没做完。
# 只用到 dwmapi 里的一个属性，所以开最小 feature 集。
#
# 另外几项给「启动路径上的最后一道防线」用（见 lib.rs 的
# `acquire_single_instance` / `show_fatal_dialog`）：
#   Win32_System_Threading          —— CreateMutexW，单实例互斥体
#   Win32_Security                  —— CreateMutexW 的签名里有 SECURITY_ATTRIBUTES，
#                                       windows-sys 把它挂在 Security 这个 feature 下
#                                      （不加就会看到「no CreateMutexW in Threading」）
#   Win32_UI_WindowsAndMessaging    —— FindWindowW / SetForegroundWindow / MessageBoxW
#   Win32_Foundation                —— GetLastError / ERROR_ALREADY_EXISTS
#
# ★ 下面第二个依赖块（`windows`，不是 `windows-sys`）是「系统信息」子系统专用的：
#   tauri 2.x 自己就依赖 windows 0.61，所以这里启用 feature 不引入任何新的
#   下载项 —— 对离线构建环境是决定性的（reqwest + rustls + aws-lc-rs 那条链
#   本地根本装不上）。feature 逐条对应用途：
#
#   Devices_Bluetooth                        —— BluetoothDevice / BluetoothLEDevice
#   Devices_Bluetooth_GenericAttributeProfile —— GATT 服务/特征（BLE 电量 BAS）
#   Devices_Enumeration                      —— DeviceInformation 设备枚举与 PnP 属性
#   Devices_Radios                           —— 蓝牙无线电开关状态（"蓝牙关了"这个态）
#   Foundation_Collections                   —— IVectorView（枚举返回的集合类型）
#   Storage_Streams                          —— DataReader（读 GATT 返回值）
#   Win32_Networking_WinHttp                 —— HTTPS 查询额度（复用系统 TLS，零新增依赖）
#   Win32_System_WinRT                       —— RoInitialize / RoUninitialize
#   Win32_System_Com                         —— WinRT 的 COM 基座（HRESULT / IUnknown 相关）
#   Win32_System_Registry                    —— 经典蓝牙设备的系统元数据（BTHPORT 注册表）
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Devices_Bluetooth",
    "Devices_Bluetooth_GenericAttributeProfile",
    "Devices_Enumeration",
    "Devices_Radios",
    "Foundation_Collections",
    "Storage_Streams",
    "Win32_Networking_WinHttp",
    "Win32_System_WinRT",
    "Win32_System_Com",
    "Win32_System_Registry",
] }
# ★ 集合接口（IIterable / IVector）的实体在这里。
#
# windows 0.61 把 Foundation::Collections 的集合类型拆到了独立 crate
# `windows-collections`，而 windows crate **没有** re-export 它 ——
# 所以要用 `DeviceInformation::FindAllAsync…AndAdditionalProperties`
# （它的 additionalproperties 形参是 `IIterable<HSTRING>`）就必须显式声明。
#
# 又是零下载：它本来就是 windows 0.61 的传递依赖。
# 用途：电量索引需要显式请求 `DEVPKEY_Bluetooth_Battery` 属性
# （默认属性集里没有它，不请求就永远读到 None）。
windows-collections = "0.2"
# ★ 桌面外壳「去浏览器化」专用。
#
# Tauri 自己就用 webview2-com 0.38（见 tauri 的 Cargo.toml），所以这里
# 加它不引入新版本、不新增下载项 —— 只是让我们能直接摸到 WebView2 的
# ICoreWebView2Settings3/4/5，把「像一个浏览器」的那些行为关掉。
#
# 为什么必须绕到这一层：Tauri 的 WebviewWindowBuilder 只暴露了
# `additional_browser_args`（Chromium 命令行开关），**没有**暴露
# WebView2 的 Settings 接口。而 F5 / Ctrl+R / Ctrl+P / Ctrl+F / F12
# 这类浏览器专属加速键只能由 `AreBrowserAcceleratorKeysEnabled`
# 关掉 —— 命令行开关管不到它们。
webview2-com = "0.38"
windows-sys = { version = "0.61", features = [
    "Win32_Graphics_Dwm",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

# release 优化参数（[profile.release]）已上移到 workspace 根 Cargo.toml ——
# workspace 下 profile 只能定义在根；完整注释（为何不设 panic="abort"）同址。
